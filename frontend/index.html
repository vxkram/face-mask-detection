<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Mask Detector</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page">
    <div class="card">
      <h1>Face Mask Detector</h1>
      <p class="subtitle">Upload a photo to check for a face mask &mdash; powered by a MobileNetV2 model fine-tuned on ~5,000 labeled faces.</p>

      <label for="file-input" id="drop-zone" class="drop-zone">
        <img id="preview" class="preview" alt="" hidden />
        <div id="drop-zone-text" class="drop-zone-text">
          <span class="drop-zone-icon">📷</span>
          <span>Click or drag an image here</span>
        </div>
      </label>
      <input type="file" id="file-input" accept="image/*" hidden />

      <button id="detect-button" disabled>Detect</button>

      <p id="error" class="error" hidden></p>

      <div id="result" class="result" hidden>
        <div id="result-badge" class="result-badge"></div>
        <div class="probabilities" id="probabilities"></div>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
